<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/media-library.css">
    <link rel="stylesheet" href="../css/luxury-theme.css">
    <title>Media Library</title>
    <meta name="robots" content="noindex,nofollow">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>

<script src="../js/supabase-client.js"></script>

<script src="../js/admin/media-library.js"></script>

<select id="filterCategory">
    <option value="">All Categories</option>
</select>

<select id="filterMediaType">
    <option value="">All Media</option>
    <option value="image">Photography</option>
    <option value="video">Video</option>
</select>

<select id="filterStatus">
    <option value="">All Status</option>
    <option value="published">Published</option>
    <option value="draft">Draft</option>
</select>

<button type="button" id="refreshMediaBtn">
    Refresh
</button>

<div id="mediaGrid"></div>

<p id="libraryMessage"></p>
</body>
</html>
