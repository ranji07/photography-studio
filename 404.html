<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex,nofollow">

    <title>Page Not Found | ZIRIA</title>

    <link rel="icon"
          type="image/svg+xml"
          href="/assets/images/favicon.svg">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #171715;
            color: #F3F0E9;

            font-family: Arial, sans-serif;

            text-align: center;
            padding: 25px;
        }

        .error-container {
            max-width: 600px;
        }

        .error-code {
            color: #A48B69;
            letter-spacing: 5px;
            font-size: 12px;
        }

        h1 {
            font-family: Georgia, serif;
            font-weight: 400;
            font-size: clamp(45px, 8vw, 75px);
        }

        p {
            color: #aaa49a;
            line-height: 1.8;
        }

        a {
            display: inline-block;
            margin-top: 25px;

            padding: 14px 25px;

            background: #A48B69;
            color: #171715;

            text-decoration: none;

            font-size: 11px;
            letter-spacing: 2px;
        }

    </style>

</head>

<body>

<main class="error-container">

    <p class="error-code">404 · PAGE NOT FOUND</p>

    <h1>Lost in the moment?</h1>

    <p>
        The page you are looking for may have moved
        or no longer exists.
    </p>

    <a href="/">
        RETURN TO HOMEPAGE
    </a>

</main>

</body>

</html>
